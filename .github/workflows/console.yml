name: "Console SDLC CI"

on:
  push:
    branches: ["main"]
    paths:
      - "apps/console/**"
      - ".github/workflows/console.yml"
  pull_request:
    paths:
      - "apps/console/**"
      - ".github/workflows/console.yml"

jobs:
  backend:
    name: "backend (${{ matrix.os }}, Python ${{ matrix.python }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Installer
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests migrations
      - name: Typecheck
        run: mypy src
      - name: Tests
        run: python -m unittest discover -s tests -v

  frontend:
    name: "frontend (Node ${{ matrix.node }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        working-directory: apps/console/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Installer
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build

  wsl2:
    name: "WSL2 smoke (best effort)"
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier WSL2
        shell: pwsh
        run: wsl --status
      - name: Smoke test dans WSL2
        shell: pwsh
        run: wsl bash apps/console/scripts/wsl2-smoke.sh
