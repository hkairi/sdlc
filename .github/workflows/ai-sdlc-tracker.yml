name: "ai-sdlc-tracker CI"
# Tests et typecheck du plugin de suivi (foyer : templates/adapters/opencode/plugins).
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  plugin:
    name: "tests + typecheck (Node ${{ matrix.node-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "26"]
    defaults:
      run:
        working-directory: templates/adapters/opencode/plugins/ai-sdlc-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: templates/adapters/opencode/plugins/ai-sdlc-tracker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
