name: ai-sdlc-tracker

on:
  push:
    paths:
      - "templates/adapters/opencode/plugins/ai-sdlc-tracker/**"
      - ".github/workflows/ai-sdlc-tracker.yml"
  pull_request:
    paths:
      - "templates/adapters/opencode/plugins/ai-sdlc-tracker/**"
      - ".github/workflows/ai-sdlc-tracker.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    defaults:
      run:
        working-directory: templates/adapters/opencode/plugins/ai-sdlc-tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: templates/adapters/opencode/plugins/ai-sdlc-tracker/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Vérification des types
        run: npm run typecheck
